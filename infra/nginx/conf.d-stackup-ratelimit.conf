# /etc/nginx/conf.d/stackup-ratelimit.conf
#
# limit_req_zone 은 http 컨텍스트에만 둘 수 있는데, 이 호스트의 nginx.conf 는
# 다른 사이트 4개와 공유된다. 그래서 nginx.conf 를 고치는 대신 conf.d 로 분리했다
# (nginx.conf 가 conf.d/*.conf 를 include 한다).
#
# zone 선언 자체는 다른 사이트에 영향이 없다 — 공유 메모리만 잡을 뿐, 실제 제한은
# limit_req 를 붙인 stack-up.shop 의 location 에만 걸린다.

# 일반 API. 페이지 한 번 열 때 여러 요청이 나가므로 burst 로 흡수한다(사이트 설정 참고).
limit_req_zone $binary_remote_addr zone=stackup_api:10m rate=20r/s;

# 인증 경로. 자격증명 대입·OAuth 남용을 늦춘다.
limit_req_zone $binary_remote_addr zone=stackup_auth:10m rate=2r/s;
