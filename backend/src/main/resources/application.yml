spring:
  application:
    name: stackup
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:38010}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
    access-token-type: ${JWT_ACCESS_TOKEN_TYPE:Bearer}
    encryption-key: ${ENCRYPTION_KEY:}
    oauth-state-ttl: ${OAUTH_STATE_TTL:5m}
    oauth-state-byte-length: ${OAUTH_STATE_BYTE_LENGTH:32}
    pkce-code-verifier-byte-length: ${PKCE_CODE_VERIFIER_BYTE_LENGTH:32}
    refresh-token-byte-length: ${REFRESH_TOKEN_BYTE_LENGTH:32}
    refresh-token-cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
    refresh-token-cookie-path: ${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
    refresh-token-cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}
    refresh-token-cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
    refresh-token-cookie-http-only: ${REFRESH_TOKEN_COOKIE_HTTP_ONLY:true}
    internal-api-key: ${CORE_INTERNAL_API_KEY:}
  github:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:}
    scopes: read:user user:email repo
    oauth-base-url: ${GITHUB_OAUTH_BASE_URL:https://github.com}
    token-type: ${GITHUB_OAUTH_TOKEN_TYPE:bearer}
    code-challenge-method: ${GITHUB_OAUTH_CODE_CHALLENGE_METHOD:S256}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    api-version: ${GITHUB_API_VERSION:2022-11-28}
    connect-timeout: ${GITHUB_CONNECT_TIMEOUT:3s}
    read-timeout: ${GITHUB_READ_TIMEOUT:5s}
  s3:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:stackup}
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:true}
  messaging:
    rabbitmq:
      publisher: core-server
      version: v1
      message:
        content-type: application/json
        content-encoding: UTF-8
        trace-id-header: x-trace-id
      template:
        mandatory: true
      exchanges:
        durable: true
        auto-delete: false
        names:
          core-to-ai: stackup.core-to-ai
          ai-to-core: stackup.ai-to-core
      queues:
        durable: true
        names:
          ai-analyze-resume: ai.analyze.resume
          ai-analyze-repository: ai.analyze.repository
          ai-generate-questions: ai.generate.questions
          ai-generate-followup: ai.generate.followup
          core-callback-analysis: core.callback.analysis
          core-callback-questions: core.callback.questions
      routing-keys:
        analyze-resume: analyze.resume
        analyze-repository: analyze.repository
        generate-questions: generate.questions
        generate-followup: generate.followup
        callback-analysis: callback.analysis
        callback-questions: callback.questions
  sse:
    timeout: 30m
    keep-alive-interval: 30s
    stream-token-ttl: 60s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-domain}
