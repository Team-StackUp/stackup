# 테스트 컨텍스트는 DataSource 를 제외하므로 db 컨트리뷰터가 없다.
# 그룹 멤버십 검증은 **켜둔 채로**(운영에서 이름 오타가 조용히 무시되지 않게 — 실제로
# rabbitmq 키 오타가 헬스체크를 무력화한 적이 있다) 테스트에서만 그룹을 축소한다.
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt-secret: test-jwt-secret
    encryption-key: test-encryption-key
    internal-api-key: test-internal-api-key
  github:
    client-id: test-github-client-id
    client-secret: test-github-client-secret
    redirect-uri: http://localhost:5173/auth/callback
    scopes: read:user user:email repo
