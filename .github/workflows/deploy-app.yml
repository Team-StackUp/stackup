name: STACK-UP deploy ana-server

# dev 브랜치가 업데이트되면 AI서버와 실시간서버를 빌드하고 배포 
# 상우 원격컴에서만 작동하니 클라우드로 옮기면 삭제해야 함 
# 백엔드 코어랑 프론트는 아직 도커에 정의되지 않았으니.. 그때 이어서 해야 함 

on:
  push:
    branches: [dev]
    paths:
      - "ai/**"
      - "realtime/**"
      - "docker-compose.yml"
      - "infra/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    env:
      DEPLOY_DIR: /home/stackup/stackup

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to deploy dir (preserve .env and data)
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='var/' \
            --exclude='**/__pycache__' \
            --exclude='**/.venv' \
            --exclude='**/node_modules' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

      - name: Ensure .env exists and contains current secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$DEPLOY_DIR"
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # 비밀 값은 임시 파일을 거쳐서 .env에 주입 — 명령줄 노출 회피.
          # 키마다 같은 awk 블록을 한 번씩 적용.
          inject_secret() {
            local name="$1"
            local value="$2"
            local tmp
            tmp=$(mktemp)
            awk -v k="$name" -v v="$value" '
              BEGIN { written = 0 }
              $0 ~ "^" k "=" { print k "=" v; written = 1; next }
              { print }
              END { if (!written) print k "=" v }
            ' .env > "$tmp"
            mv "$tmp" .env
          }
          inject_secret LLM_API_KEY "$LLM_API_KEY"
          inject_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          chmod 600 .env

      - name: Build and restart app services
        run: |
          cd "$DEPLOY_DIR"
          docker compose up -d --build ai realtime

      - name: Wait for healthy
        run: |
          cd "$DEPLOY_DIR"
          set +e
          rc=0
          for svc in ai realtime; do
            container="stackup-$svc"
            ok=0
            for i in $(seq 1 36); do
              h=$(docker inspect --format '{{ .State.Health.Status }}' "$container" 2>/dev/null || echo "missing")
              echo "  [$i] $container: $h"
              if [ "$h" = "healthy" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$container did not become healthy"
              docker compose logs --tail=100 "$svc" || true
              rc=1
            fi
          done
          docker compose ps
          exit $rc

      - name: Prune dangling images (best-effort)
        if: always()
        run: docker image prune -f >/dev/null 2>&1 || true
