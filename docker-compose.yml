name: stackup

services:
  postgres:
    build: ./infra/postgres
    container_name: stackup-postgres
    command: ["postgres", "-c", "port=38040"]
    ports:
      - "${POSTGRES_PORT:-38040}:38040"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stackup}
      POSTGRES_USER: ${POSTGRES_USER:-stackup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackup}
      PGPORT: "38040"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 38040 -U ${POSTGRES_USER:-stackup}"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    build: ./infra/rabbitmq
    container_name: stackup-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-38050}:38050"
      - "${RABBITMQ_MANAGEMENT_PORT:-38051}:38051"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stackup}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stackup}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    build: ./infra/minio
    container_name: stackup-minio
    ports:
      - "${MINIO_API_PORT:-38060}:38060"
      - "${MINIO_CONSOLE_PORT:-38061}:38061"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mc alias set hc http://localhost:38060 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready hc"
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: stackup-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-stackup}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  ai:
    build: ./ai
    container_name: stackup-ai
    ports:
      - "${AI_PORT:-38030}:38030"
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-stackup}:${RABBITMQ_PASSWORD:-stackup}@rabbitmq:38050/
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/var/lib/stackup-ai/storage}
      S3_ENDPOINT_URL: http://minio:38060
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${MINIO_BUCKET:-stackup}
      S3_REGION: ${S3_REGION:-us-east-1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://factchat-cloud.mindlogic.ai/v1/gateway}
      LLM_PRO_MODEL: ${LLM_PRO_MODEL:-gemini-3.1-pro-preview}
      LLM_FLASH_MODEL: ${LLM_FLASH_MODEL:-gemini-3.1-flash-lite}
      LLM_FLASH_TEMPERATURE: ${LLM_FLASH_TEMPERATURE:-0.4}
      LLM_FLASH_MAX_TOKENS: ${LLM_FLASH_MAX_TOKENS:-512}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ko}
      # AI → Core 내부 API. 같은 compose 네트워크의 backend 서비스로 직접 라우팅.
      CORE_INTERNAL_BASE_URL: ${CORE_INTERNAL_BASE_URL:-http://backend:38010}
      CORE_INTERNAL_API_KEY: ${CORE_INTERNAL_API_KEY:-local-development-internal-api-key}
      # 임베딩
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        # Spring RabbitMqConfig 가 ai.generate.*/ai.analyze.* 큐를 declare 한 뒤에야
        # AI runner.py(passive=true 큐 검색)가 부팅 가능. backend healthy 이후 시작.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:38030/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  realtime:
    build: ./realtime
    container_name: stackup-realtime
    ports:
      - "${REALTIME_PORT:-38020}:38020"
    environment:
      REALTIME_LISTEN_ADDR: :38020
      REALTIME_RABBITMQ_URL: amqp://${RABBITMQ_USER:-stackup}:${RABBITMQ_PASSWORD:-stackup}@rabbitmq:38050/
      REALTIME_LOG_LEVEL: ${REALTIME_LOG_LEVEL:-info}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:38020/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: stackup-backend
    ports:
      - "${BACKEND_PORT:-38010}:38010"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: "38010"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "38040"
      POSTGRES_DB: ${POSTGRES_DB:-stackup}
      POSTGRES_USER: ${POSTGRES_USER:-stackup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackup}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "38050"
      RABBITMQ_USER: ${RABBITMQ_USER:-stackup}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-stackup}
      # 비밀값은 .env 또는 GitHub Secrets 로 주입. 값이 비면 application-local.yml 의 dev default 적용.
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORE_INTERNAL_API_KEY: ${CORE_INTERNAL_API_KEY:-local-development-internal-api-key}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:5173/auth/callback}
      S3_ENDPOINT: http://minio:38060
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET:-stackup}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:38010/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
