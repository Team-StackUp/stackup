spring:
  application:
    name: stackup
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
    encryption-key: ${ENCRYPTION_KEY:}
  github:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:5173/auth/callback}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:stackup}
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:true}
  messaging:
    rabbitmq:
      publisher: core-server
      version: v1
      message:
        content-type: application/json
        content-encoding: UTF-8
        trace-id-header: x-trace-id
      template:
        mandatory: true
      exchanges:
        durable: true
        auto-delete: false
        names:
          core-to-ai: stackup.core-to-ai
          ai-to-core: stackup.ai-to-core
      queues:
        durable: true
        names:
          ai-analyze-resume: ai.analyze.resume
          ai-analyze-repository: ai.analyze.repository
          ai-generate-questions: ai.generate.questions
          ai-generate-followup: ai.generate.followup
          core-callback-analysis: core.callback.analysis
          core-callback-questions: core.callback.questions
      routing-keys:
        analyze-resume: analyze.resume
        analyze-repository: analyze.repository
        generate-questions: generate.questions
        generate-followup: generate.followup
        callback-analysis: callback.analysis
        callback-questions: callback.questions
  sse:
    timeout: 30m
    keep-alive-interval: 30s
    stream-token-ttl: 60s
  cors:
    allowed-origins:
      - http://localhost:5173
